<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="parent.css" />
    <title>Document</title>
  </head>
  <body>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Numquam voluptas
      quae veniam velit a, suscipit pariatur nobis officiis laboriosam laborum
      culpa rem explicabo dicta. Iusto officiis totam minus ratione velit!

      <span id="small">THIS IS A SPAN</span>
    </p>
    <form id="container"></form>

    <script>
      document.body.style.display = "flex";
      document.body.style.justifyContent = "center";
      document.body.style.alignItems = "center";
      document.querySelector("p").style.display = "none";
      let container = document.getElementById("container");
      container.style.display = "flex";
      container.style.alignItems = "center";

      container.style.flexDirection = "column";
      container.style.width = "350px";
      container.style.backgroundColor = "#2a5694c2";
      container.style.borderRadius = "10px";
      container.style.padding = "15px";

      let div = document.createElement("div");

      let span = document.createElement("span");

      let input = document.createElement("input");
      input.placeholder = "Enter your name";

      let label = document.createElement("label");
      label.innerHTML = "Full Name";

      let div_1 = document.createElement("div");

      let span_1 = document.createElement("span");

      let input_1 = document.createElement("input");
      input_1.placeholder = "Enter your email";
      input_1.type = "email";

      let label_1 = document.createElement("label");

      label_1.innerHTML = "Email";

      let div_2 = document.createElement("div");

      let span_2 = document.createElement("span");

      let input_2 = document.createElement("input");
      input_2.placeholder = "Enter your password";
      input_2.type = "password";

      let div_3 = document.createElement("div");

      let span_3 = document.createElement("span");

      let input_3 = document.createElement("input");
      input_3.placeholder = "comfirm password";
      input_3.type = "password";

      let label_3 = document.createElement("label");
      label_3.innerHTML = "comfirm Password";

      [input, input_1, input_2, input_3].forEach(function (el) {
        el.style.border = "1px solid gray";
        el.style.padding = "12px";
        el.style.borderRadius = "3px";
        el.style.backgroundColor = "#e6dcdc";
        el.style.border = "none";
        el.style.fontSize = "18px";
        el.style.width = "100%";

        el.onfocus = function () {
          el.style.outline = "none";
        };
      });

      let label_2 = document.createElement("label");
      label_2.innerHTML = "Password";

      [label, label_1, label_2, label_3].forEach(function (ml) {
        ml.style.fontSize = "18px";
        ml.style.fontWeight = 600;
        ml.style.color = "white";
        ml.style.marginTop = "8px";
      });

      let btn = document.createElement("button");
      btn.innerHTML = "SUBMIT";
      btn.type = "submit";
      btn.style.marginTop = "18px";
      btn.style.padding = "12px";
      btn.style.border = "none";
      btn.style.fontSize = "18px";
      btn.style.backgroundColor = "#e6dcdc";
      btn.style.cursor = "pointer";
      btn.style.fontWeight = 600;
      btn.style.color = "#626387";
      btn.style.width = "75%";
      btn.style.borderRadius = "3px";

      /*
      - create a div element
      - create a span element
      - append the label, input and span in the div element
      - append the div element to the container

      
      */

      [div, div_1, div_2, div_3].forEach(function (el) {
        el.style.gap = "5px";
        el.style.display = "flex";
        el.style.flexDirection = "column";
      });

      container.append(div);
      div.append(label);
      div.append(input);
      div.append(span);

      container.append(div_1);
      div_1.append(label_1);
      div_1.append(input_1);
      div_1.append(span_1);

      container.append(div_2);
      div_2.append(label_2);
      div_2.append(input_2);
      div_2.append(span_2);

      container.append(div_3);
      div_3.append(label_3);
      div_3.append(input_3);
      div_3.append(span_3);

      container.append(btn);

      container.onsubmit = function (e) {
        e.preventDefault();
        [input, input_1, input_2, input_3].forEach(function (el) {
          console.log(el.parentElement.children[2]);

          if (el.value === "") {
            el.parentElement.children[2].innerHTML = "this fill is required";
            el.parentElement.children[2].style.color = "red";
          } else {
            el.parentElement.children[2].innerHTML = "";
          }
        });
      };
    </script>
  </body>
</html>
